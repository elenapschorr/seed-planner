name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The isolation tests start PostgreSQL in Docker (available on GitHub runners)
      - run: dotnet test --no-build --configuration Release
      # Tests of the browser scripts (geometry and taking areas from lines in the picture) run with Node, which is on the runner
      - run: node --test tests/js/garden-geometry.test.js tests/js/garden-trace.test.js tests/js/garden-model.test.js tests/js/garden-history.test.js tests/js/page/page.test.js

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t seed-planner:${{ github.sha }} .